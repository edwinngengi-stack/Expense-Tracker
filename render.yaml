services:
  - type: web
    name: expense-tracker
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: DB_FILE
        value: /var/data/tracker.db
      - key: NODE_VERSION
        value: lts
    disk:
      name: expense-tracker-data
      mountPath: /var/data
      sizeGB: 1
